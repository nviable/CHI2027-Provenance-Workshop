name: Check & Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Worker types
        run: npm run cf-typegen

      - name: Typecheck Astro & React
        run: npm run check

      - name: Build site & validate YAML data
        run: npm run build
