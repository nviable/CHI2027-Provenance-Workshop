activitiesHeading: Three connected activities
activitiesIntro: >-
  Each activity feeds the next: needs and breakpoints become designs, and
  designs become things to test.

activities:
  - letter: A
    title: Map the journey
    description: >-
      Each group gets a scenario pack: one media item and its provenance trail
      (e.g., a photo signed at capture, edited, then forwarded with metadata
      stripped). Groups follow it through the six stages and note who handles
      it, what is needed or added, and what is lost or exposed.
    output: journey maps
    visual: none
  - letter: B
    title: Design the disclosure
    description: >-
      With a constrained persona (a screen-reader user, a fact-checker on
      deadline, a journalist protecting a source), groups design how each
      breakpoint shows all four states.
    output: interface patterns
    visual: ladder
    ladderRows:
      - Glance
      - Summary
      - History
      - Verify
  - letter: C
    title: Evaluate
    description: >-
      Groups turn designs into evaluation plans: measures, comparison
      conditions, populations, and what counts as *calibrated* rather than
      maximal trust.
    output: evaluation matrix
    visual: dimensions
    dimensions:
      - label: Noticeability
        crossCutting: false
      - label: Comprehension
        crossCutting: false
      - label: Calibrated trust
        crossCutting: false
      - label: Actionability
        crossCutting: false
      - label: Accessibility (every cell)
        crossCutting: true
      - label: Cross-cultural validity (every cell)
        crossCutting: true
