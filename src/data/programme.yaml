speakersHeading: Invited speakers
speakersIntro: >-
  Two invited talks frame the workshop from complementary perspectives:
  provenance infrastructure and frontline newsroom/creator practice.
speakers:
  - slot: Invited talk 1 · 0:10–0:30
    theme: Infrastructure to interface
    name: Speaker TBA
    affiliation: Technical constraints for design
    tba: true
  - slot: Invited talk 2 · 1:30–1:50
    theme: The journalist and creator view
    name: Speaker TBA
    affiliation: Real-world decision needs
